# Publish a release when a version tag is pushed.
#
# git tag -a v5.1.1 -m "Version 5.1.1"
# git push origin v5.1.1

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn -B clean package

      - name: Resolve release JAR
        id: jar
        run: |
          JAR_PATH=$(ls ./target/ImageOnMap-*.jar | grep -v original | head -n 1)
          echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR_PATH")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ImageOnMap ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: ${{ steps.jar.outputs.path }}
